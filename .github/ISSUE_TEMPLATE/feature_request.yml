name: Feature request
description: Propose a focused protocol, security, or operations improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include protocol and compatibility implications.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and logging impact
    validations:
      required: true
